[package]
name = "beads-app"
description = "Bunch-a-Beads Pattern Designer - desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

build = "build.rs"

[[bin]]
name = "BunchABeads"
path = "src/main.rs"

[dependencies]
beads-core = { path = "../beads-core" }
# Pinned to 0.31 for the first build; moving to the newest eframe is a later step.
eframe = { version = "0.31", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"   # draws the material list into saved pictures (same font engine egui uses)
rfd = "0.15"   # folder / open / save dialogs (the browser's file picker on the web)
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }   # local time for bookmark names

# Only for the web version (built with Trunk, see README).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement",
    "Storage", "Blob", "Url", "Performance", "Response",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"   # puts the icon into BunchABeads.exe
